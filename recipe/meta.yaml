{% set name = "scikit-rf" %}
{% set version = "2.0.1" %}
{% set deselect_tests = " --deselect=skrf/tests/test_network.py::NetworkTestCase" %}

# >   with pytest.raises(RuntimeWarning):
# E   Failed: DID NOT RAISE <class 'RuntimeWarning'>
# The test uses pytest.raises(RuntimeWarning) but warnings aren't exceptions—they need pytest.warns() instead.
package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://github.com/{{ name }}/{{ name }}/archive/v{{ version }}.tar.gz
  sha256: 36d5dca78a0f6d01074583536dd225b0c7eee5badc68db7e3168ddcae6d441a7

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - wheel
    - setuptools >=64
  run:
    - python
    - numpy >=1.21
    - scipy >=1.7
    - pandas >=1.1
    - typing-extensions
    - typing_extensions
  run_constrained:
    # testspice
    - pyspice >=1.5
    # plot
    - matplotlib-base >=3.5
    # xlsx
    - openpyxl >=3.0
    # netw
    - networkx >=2.0
    # visa
    - PyVISA >=1.12
    - pyvisa-py >=0.6

test:
  source_files:
    - skrf/tests
    - skrf/io/tests
    - doc
  imports:
    - skrf
    - skrf.calibration
    - skrf.data
    - skrf.io
    - skrf.media
  commands:
    - pip check
    - pytest -v skrf {{ deselect_tests }}
  requires:
    - pip
    - pytest >=7.0
    - pytest-mock >=3.10

about:
  home: https://scikit-rf.org
  license: BSD-3-Clause
  license_file: LICENSE.txt
  license_family: BSD
  summary: Object Oriented Microwave Engineering.
  doc_url: https://scikit-rf.readthedocs.io
  description: |
    scikit-rf is an Open Source, BSD-licensed package for RF/Microwave
    engineering implemented in the Python programming language. It provides
    a modern, object-oriented library which is both flexible and scalable.
  dev_url: https://github.com/scikit-rf/scikit-rf

extra:
  recipe-maintainers:
    - arsenovic
